services:
  jeffy:
    image: python:3.11-slim
    command: >
      bash -c "pip install jeffy-classify && jeffy serve --host 0.0.0.0 --port 8400"
    ports:
      - "8400:8400"
    volumes:
      - jeffy-cache:/root/.cache

  bridge:
    build: .
    ports:
      - "8401:8401"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - jeffy
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  jeffy-cache:
